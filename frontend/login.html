<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | WIRAM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="login">
    <nav class="public-nav">
      <div class="container public-nav-inner">
        <a class="brand" href="index.html">WIRAM</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="register.html">Register</a>
        </div>
      </div>
    </nav>

    <main class="auth-wrap">
      <section class="auth-card">
        <h1>Login</h1>
        <p class="muted">Sign in to access your role-based dashboard.</p>
        <form id="loginForm" novalidate>
          <div class="form-grid">
            <div class="form-group full">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required placeholder="you@example.com" />
            </div>
            <div class="form-group full">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                placeholder="Enter your password"
              />
            </div>
          </div>
          <button class="btn btn-primary" type="submit">Login</button>
        </form>

        <p class="muted" style="margin-top: 0.9rem;">
          New user? <a href="register.html">Create an account</a>
        </p>
      </section>
    </main>

    <script src="js/app.js" defer></script>
    <script src="js/auth.js" defer></script>
  </body>
</html>
