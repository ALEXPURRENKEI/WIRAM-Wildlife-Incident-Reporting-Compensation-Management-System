<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users | WIRAM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="manage-users" data-auth="true" data-roles="admin">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="admin-dashboard.html">WIRAM</a>
        <nav class="sidebar-nav">
          <a href="admin-dashboard.html">Dashboard</a>
          <a class="active" href="manage-users.html">Manage Users</a>
          <a href="reports.html">All Reports</a>
          <a href="#" class="js-logout">Logout</a>
        </nav>
        <div class="sidebar-footer">Admin Portal</div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <button class="icon-btn js-sidebar-toggle" type="button">Menu</button>
          <h1>User Management</h1>
          <div class="topbar-user">
            <span class="js-user-name"></span>
            <button class="btn btn-secondary btn-sm js-logout" type="button">Logout</button>
          </div>
        </header>

        <main class="content">
          <section class="card">
            <div class="filter-bar">
              <div>
                <h2>Registered Users</h2>
                <p class="muted">Update role permissions for members, officers, and admins.</p>
              </div>
              <div class="form-group">
                <label for="usersRoleFilter">Filter by Role</label>
                <select id="usersRoleFilter">
                  <option value="all">All</option>
                  <option value="member">Member</option>
                  <option value="officer">Officer</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Current Role</th>
                    <th>Joined</th>
                    <th>Change Role</th>
                    <th>Save</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/app.js" defer></script>
    <script src="js/auth.js" defer></script>
  </body>
</html>
